name: trase-build-ghcr

# Interim image build while the fork has no registry secrets: builds any ref with
# upstream's Dockerfile on the runner and pushes to this org's GitHub Container
# Registry with the job's own token. Prints the digest. Retire once
# trase-release.yml has its Artifact Registry inputs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build (the top of the patch stack, or trase/main)
        required: true
        default: trase/main
      image_tag:
        description: Image tag to push (for example v1.6.0-trase.1)
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Patch ledger is complete
        run: trase/check-patches.sh
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/agentgateway" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ inputs.image_tag }}
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ inputs.image_tag }}
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Pin this
        run: |
          echo "image: \`${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}\`" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "built ${{ inputs.ref }} at ${{ github.sha }}; patches above $(git describe --tags --abbrev=0 --match 'v*'): $(git rev-list --count --no-merges $(git describe --tags --abbrev=0 --match 'v*')..HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
